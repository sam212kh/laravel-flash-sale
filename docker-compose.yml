services:
    app:
        build: .
        working_dir: /var/www/html/flash-sale
        volumes:
            - .:/var/www/html/flash-sale
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_started
    nginx:
        image: nginx:1.27-alpine
        ports:
            - "8080:80"
        volumes:
            - .:/var/www/html/flash-sale:ro
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
    queue:
        build: .
        command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=90
        volumes:
            - .:/var/www/html/flash-sale
        depends_on:
            - app
            - redis
    scheduler:
        build: .
        command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
        volumes:
            - .:/var/www/html/flash-sale
        depends_on:
            - app
            - postgres
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: flash_sale
            POSTGRES_USER: flash_sale
            POSTGRES_PASSWORD: secret
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U flash_sale -d flash_sale"]
            interval: 5s
            timeout: 5s
            retries: 10
    redis:
        image: redis:7-alpine
        ports:
            - "6380:6379"
        volumes:
            - redis_data:/data
volumes:
    postgres_data:
    redis_data:
